[package]
name = "chain_forge"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
http = "1.1.0"
httparse = "1.8.0"
log = "0.4.21"
mime = "0.3.17"
rand = "0.8.5"
rmp-serde = "1.1.2"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.116"
stderrlog = "0.6.0"

[profile.release]
debug = 1
